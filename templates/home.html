<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Home Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            color: #222;
        }

        .navbar {
            background: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5b4bdb;
        }

        .back {
            text-decoration: none;
            color: #555;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 55px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .field {
            margin-bottom: 24px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5b4bdb;
        }

        .items-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .checkbox-item {
            border: 1px solid #ddd;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            background: #fafafa;
        }

        .checkbox-item:hover {
            border-color: #5b4bdb;
            background: #f5f3ff;
        }

        .checkbox-item input {
            width: auto;
            margin-right: 8px;
        }

        .submit-button {
            width: 100%;
            border: none;
            background: #5b4bdb;
            color: white;
            padding: 15px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-button:hover {
            background: #4939c7;
        }

        .tip {
            margin-top: 20px;
            padding: 15px;
            background: #f5f3ff;
            border-radius: 10px;
            color: #555;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 25px;
            }

            .checkbox-group {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">💰 PocketSmart AI</div>

        <a class="back" href="/dashboard">
            ← Dashboard
        </a>
    </div>

    <div class="container">

        <div class="header">
            <div class="icon">🏠</div>

            <h1>Home Planner</h1>

            <p>
                Tell us your budget and requirements.
                PocketSmart AI will create a practical plan for you.
            </p>
        </div>

        <div class="form-card">

            <form action="/generate-home" method="post">

                <div class="field">
                    <label for="budget">💰 Your Budget</label>

                    <input
                        type="number"
                        id="budget"
                        name="budget"
                        placeholder="Example: 50000"
                        min="1"
                        required
                    >
                </div>


                <div class="field">
                    <label for="room_type">🏠 Room Type</label>

                    <select id="room_type" name="room_type" required>
                        <option value="">Select room type</option>
                        <option value="Living Room">Living Room</option>
                        <option value="Bedroom">Bedroom</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Dining Room">Dining Room</option>
                        <option value="Full Home">Full Home</option>
                    </select>
                </div>


                <div class="field">

                    <div class="items-title">
                        🛍️ What do you want to buy?
                    </div>

                    <div class="checkbox-group">

                        <label class="checkbox-item">
                            <input
                                type="checkbox"
                                name="items"
                                value="Lights"
                            >
                            💡 Lights
                        </label>

                        <label class="checkbox-item">
                            <input
                                type="checkbox"
                                name="items"
                                value="Fans"
                            >
                            🌀 Fans
                        </label>

                        <label class="checkbox-item">
                            <input
                                type="checkbox"
                                name="items"
                                value="Dining Table"
                            >
                            🍽️ Dining Table
                        </label>

                        <label class="checkbox-item">
                            <input
                                type="checkbox"
                                name="items"
                                value="Sofa"
                            >
                            🛋️ Sofa
                        </label>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    ✨ Generate AI Recommendation
                </button>

            </form>


            <div class="tip">
                💡 <strong>Tip:</strong>
                Select the items you need and PocketSmart AI will try to keep the estimated cost within your budget.
            </div>

        </div>

    </div>

</body>
</html>
