<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #5b4bdb;
        }

        .subtitle {
            color: #666;
            margin-top: 8px;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .card h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .card-description {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5b4bdb;
        }

        .login-button {
            width: 100%;
            border: none;
            background: #5b4bdb;
            color: white;
            padding: 14px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #4939c7;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .register-text a {
            color: #5b4bdb;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo-section">
            <div class="logo-icon">💰</div>

            <div class="logo">
                PocketSmart AI
            </div>

            <div class="subtitle">
                Your Smart Budget & Recommendation Assistant
            </div>
        </div>


        <div class="card">

            <h1>Welcome Back 👋</h1>

            <p class="card-description">
                Login to continue using PocketSmart AI.
            </p>


            <form action="/login" method="post">

                <div class="field">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login →
                </button>

            </form>


            <div class="register-text">
                Don't have an account?
                <a href="/register">Create Account</a>
            </div>

        </div>


        <div class="footer">
            © 2026 PocketSmart AI
        </div>

    </div>

</body>
</html>
